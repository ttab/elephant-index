name: Lint code

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=4m
      - name: Documentation links
        run: go run github.com/magefile/mage docs:links

  vendored-migrations:
    name: Vendored migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # vendorCheck reads the library's migrations out of the module cache,
      # resolving the directory with "go list -m", which is empty until the
      # module is downloaded. A warm cache hides this locally.
      - name: Download modules
        run: go mod download
      - name: Check vendored migrations
        run: go run github.com/magefile/mage sql:vendorCheck
