version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    goconst:
      # Test fixtures legitimately repeat string literals.
      ignore-tests: true
      # Common serialization keys and metric label names that mean different
      # things in different contexts, so a shared constant would be misleading.
      ignore-string-values:
        - ^(type|name|index|query|rel)$
    godox:
      keywords:
        - FIXME
        - BUG
    wrapcheck:
      extra-ignore-sigs:
        # The elephantine/rpc helpers construct RPC errors that already carry
        # their code. Wrapping one buries the code the handler picked, which
        # is the whole point of returning it.
        - github.com/ttab/elephantine/rpc.
        # NewSearchRequest validates caller input and returns coded RPC
        # errors, so a handler returns its error as it is for the same reason.
        - github.com/ttab/elephant-index/internal.NewSearchRequest(
        - (context.Context).Err(
        - github.com/ttab/elephantine/pg.WithTX(
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
